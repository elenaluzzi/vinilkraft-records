<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foglio Arancione</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #1a1a2e; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    let time = 0;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const cols = 40;
    const rows = 25;
    const spacing = 20;
    const dots = [];

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        dots.push({
          baseX: x * spacing - (cols * spacing) / 2,
          baseY: y * spacing - (rows * spacing) / 2,
          x: 0,
          y: 0,
          z: 0
        });
      }
    }

    function draw() {
      ctx.fillStyle = 'rgba(26, 26, 46, 0.15)';
      ctx.fillRect(0, 0, width, height);

      time += 0.02;

      const centerX = width / 2;
      const centerY = height / 2;

      dots.forEach(dot => {
        const waveX = Math.sin(time + dot.baseY * 0.03) * 30;
        const waveY = Math.cos(time * 0.7 + dot.baseX * 0.03) * 25;
        const waveZ = Math.sin(time * 1.3 + dot.baseX * 0.02 + dot.baseY * 0.02) * 40;

        const rotateY = Math.sin(time * 0.3) * 0.5;
        const rx = dot.baseX * Math.cos(rotateY) - waveZ * Math.sin(rotateY);
        const rz = dot.baseX * Math.sin(rotateY) + waveZ * Math.cos(rotateY);

        dot.x = centerX + rx + waveX;
        dot.y = centerY + dot.baseY + waveY;
        dot.z = rz;

        const scale = 600 / (600 + dot.z);
        const size = 3 * scale;
        const alpha = 0.5 + scale * 0.5;

        ctx.beginPath();
        ctx.arc(dot.x, dot.y, size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, ${140 + scale * 60}, ${30 + scale * 30}, ${alpha})`;
        ctx.fill();
      });

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
