<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Test pannello</title>
</head>
<body>
  <pre id="out">avvio…</pre>
  <script type="module">
    const out = document.getElementById('out');
    const lines = [];
    let failed = 0;
    function assert(cond, msg) {
      if (!cond) throw new Error(msg || 'assert');
    }
    async function run() {
      try {
        const m = await import('../pannello.js');
        const { mountPannello } = await import('../pannello-ui.js');
        const {
          LOW_MIDI, HIGH_MIDI, PAD_COUNT, FILTER_COUNT, BPM, SIXTEENTHS_PER_BAR,
          midiHz, isBlackKey, createPanelState, pressKey, releaseKey,
          heldMidis, togglePad, padOn, padShouldHit
        } = m;
        const tests = [
          ['costanti due ottave e otto pad a 120', () => {
            assert(LOW_MIDI === 48);
            assert(HIGH_MIDI === 72);
            assert(PAD_COUNT === 8);
            assert(FILTER_COUNT === 4);
            assert(BPM === 120);
            assert(SIXTEENTHS_PER_BAR === 16);
          }],
          ['A4 è 440', () => {
            assert(Math.abs(midiHz(69) - 440) < 1e-6);
          }],
          ['Do e neri', () => {
            assert(isBlackKey(48) === false);
            assert(isBlackKey(49) === true);
            assert(isBlackKey(50) === false);
          }],
          ['hold e release, ignora fuori range', () => {
            const s = createPanelState();
            pressKey(s, 48);
            pressKey(s, 60);
            pressKey(s, 47);
            pressKey(s, 73);
            assert(JSON.stringify(heldMidis(s)) === JSON.stringify([48, 60]));
            releaseKey(s, 48);
            assert(JSON.stringify(heldMidis(s)) === JSON.stringify([60]));
            releaseKey(s, 60);
            assert(JSON.stringify(heldMidis(s)) === JSON.stringify([]));
          }],
          ['toggle e più pad insieme', () => {
            const s = createPanelState();
            assert(togglePad(s, 0) === true);
            assert(togglePad(s, 2) === true);
            assert(padOn(s, 0) === true);
            assert(padOn(s, 2) === true);
            assert(togglePad(s, 0) === false);
            assert(padOn(s, 0) === false);
            assert(padOn(s, 2) === true);
            assert(togglePad(s, -1) === false);
            assert(togglePad(s, 8) === false);
          }],
          ['cassa sui quarti', () => {
            assert(padShouldHit(0, 0) === true);
            assert(padShouldHit(0, 4) === true);
            assert(padShouldHit(0, 8) === true);
            assert(padShouldHit(0, 12) === true);
            assert(padShouldHit(0, 1) === false);
          }],
          ['wrap del sedicesimo e indice invalido', () => {
            assert(padShouldHit(0, 16) === true);
            assert(padShouldHit(9, 0) === false);
          }],
          ['quattro tasti filtro nel DOM', () => {
            const root = document.createElement('div');
            root.id = 'pannello';
            root.innerHTML = '<div id="pad-row"></div><div id="tastiera"></div>';
            mountPannello(root, {
              onGesture: () => {},
              onNoteOn: () => {},
              onNoteOff: () => {},
              onPadsChange: () => {},
              onTapeAction: () => {}
            });
            const btns = root.querySelectorAll('.filtro');
            assert(btns.length === 4);
            assert(btns[0].textContent === 'REV');
            assert(btns[1].textContent === 'ECO');
            assert(btns[2].textContent === 'EQ');
            assert(btns[3].textContent === 'CMP');
            assert(btns[0].getAttribute('aria-label') === 'riverbero');
            assert(btns[1].getAttribute('aria-label') === 'eco');
            assert(btns[2].getAttribute('aria-label') === 'equalizzatore');
            assert(btns[3].getAttribute('aria-label') === 'compressore');
            assert(btns[0].dataset.plugin === 'rev');
          }],
          ['toggle plugin su computer, silenzio sotto 700', () => {
            const root = document.createElement('div');
            root.id = 'pannello';
            root.innerHTML = '<div id="pad-row"></div><div id="tastiera"></div>';
            const seen = [];
            const mounted = mountPannello(root, {
              onGesture: () => {},
              onNoteOn: () => { seen.push('note'); },
              onNoteOff: () => {},
              onPadsChange: () => { seen.push('pads'); },
              onTapeAction: () => { seen.push('tape'); },
              onPluginToggle: (id) => { seen.push(id); },
              viewportWidth: () => 1280
            });
            const rev = root.querySelector('[data-plugin="rev"]');
            rev.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
            assert(seen.indexOf('rev') !== -1);
            assert(seen.indexOf('note') === -1);
            assert(seen.indexOf('pads') === -1);
            assert(seen.indexOf('tape') === -1);
            mounted.setPluginOpen('rev');
            assert(rev.classList.contains('acceso'));
            const root2 = document.createElement('div');
            root2.innerHTML = '<div id="pad-row"></div><div id="tastiera"></div>';
            const seen2 = [];
            mountPannello(root2, {
              onGesture: () => {},
              onNoteOn: () => {},
              onNoteOff: () => {},
              onPadsChange: () => {},
              onTapeAction: () => {},
              onPluginToggle: (id) => { seen2.push(id); },
              viewportWidth: () => 699
            });
            root2.querySelector('[data-plugin="eq"]').dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
            assert(seen2.length === 0);
          }]
        ];
        for (const [name, fn] of tests) {
          try {
            fn();
            lines.push('PASS ' + name);
          } catch (e) {
            failed += 1;
            lines.push('FAIL ' + name + ': ' + e.message);
          }
        }
      } catch (e) {
        failed += 1;
        lines.push('FAIL import: ' + e.message);
      }
      lines.push(failed ? 'DONE failed=' + failed : 'DONE failed=0');
      out.textContent = lines.join('\n');
    }
    run();
  </script>
</body>
</html>
