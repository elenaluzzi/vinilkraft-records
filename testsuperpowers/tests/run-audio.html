<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Test audio-params</title>
</head>
<body>
  <pre id="out">avvio…</pre>
  <script type="module">
    const out = document.getElementById('out');
    const lines = [];
    let failed = 0;
    function assert(cond, msg) {
      if (!cond) throw new Error(msg || 'assert');
    }
    function deepEqual(a, b) {
      return JSON.stringify(a) === JSON.stringify(b);
    }
    async function run() {
      try {
        const { effectParams } = await import('../audio-params.js');
        const tests = [
          ['a zero è pulito', () => {
            const p = effectParams(0, 0);
            assert(p.distortion === 0);
            assert(p.delay === 0);
            assert(p.filterHz === 12000);
            assert(p.glitchGain === 0);
            assert(p.stutter === 0);
            assert(p.dry === 1);
          }],
          ['la piega glitcha i bordi, volume sempre pieno', () => {
            const p = effectParams(1, 0);
            const z = effectParams(0, 0);
            assert(p.glitchGain > 0.85);
            assert(p.stutter > 0.75);
            assert(p.dry === 1);
            assert(z.dry === 1);
            assert(p.delay < 0.1);
            assert(p.distortion > 0.6);
            assert(p.filterHz < 5000);
          }],
          ['lo schiaccia accende il glitch', () => {
            const p = effectParams(0, 1);
            assert(p.glitchGain > 0.6);
            assert(p.distortion > 0.2);
          }],
          ['clampa valori fuori range', () => {
            assert(deepEqual(effectParams(9, -2), effectParams(1, 0)));
          }],
          ['senza tema o verde: wow e pitchDrop a zero, delayTime dal glitch', () => {
            const a = effectParams(1, 0);
            const b = effectParams(1, 0, 'verde');
            assert(a.wow === 0);
            assert(a.pitchDrop === 0);
            assert(b.glitchGain === a.glitchGain);
            assert(a.delayTime > 0.05);
          }],
          ['giallo: niente glitch/stutter, c\'è wow', () => {
            const p = effectParams(1, 0, 'giallo');
            const z = effectParams(0, 0, 'giallo');
            assert(p.glitchGain === 0);
            assert(p.stutter === 0);
            assert(p.dry === 1);
            assert(p.wow > 0.5);
            assert(p.pitchDrop === 0);
            assert(p.distortion < 0.2);
            assert(z.wow === 0);
          }],
          ['violetto: niente stutter, delay profondo e pitchDrop', () => {
            const p = effectParams(1, 0, 'violetto');
            const v = effectParams(1, 0, 'verde');
            assert(p.stutter === 0);
            assert(p.glitchGain === 0);
            assert(p.delay > v.delay);
            assert(p.delayTime > 0.3);
            assert(p.pitchDrop > 0.7);
            assert(p.wow === 0);
          }]
        ];
        for (const [name, fn] of tests) {
          try {
            fn();
            lines.push('PASS ' + name);
          } catch (e) {
            failed += 1;
            lines.push('FAIL ' + name + ': ' + e.message);
          }
        }
      } catch (e) {
        failed += 1;
        lines.push('FAIL import: ' + e.message);
      }
      lines.push(failed ? 'DONE failed=' + failed : 'DONE failed=0');
      out.textContent = lines.join('\n');
    }
    run();
  </script>
</body>
</html>
