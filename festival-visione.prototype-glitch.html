<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROTOTIPO — Intensità del Glitch RGB</title>
  <!--
    PROTOTIPO DA BUTTARE.
    Tre varianti dell’intensità del Glitch RGB, switchable via ?variant=,
    sulla homepage Vision Fest (Buca + Battito ~1s + Pausa 6–7s).
  -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Syne:wght@800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Space Grotesk', sans-serif; color: #fff; background: #0a0a14; overflow-x: hidden; }
    #canvas-bg { position: fixed; inset: 0; z-index: -1; }
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 60px; background: rgba(0,0,0,0.5); backdrop-filter: blur(15px);
      position: fixed; width: 100%; top: 0; z-index: 10;
      border-bottom: 1px solid rgba(255,140,42,0.1);
    }
    .logo { font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 800; color: #ff6a00; letter-spacing: 4px; text-transform: uppercase; }
    nav ul { list-style: none; display: flex; gap: 30px; }
    nav ul a { color: #aaa; text-decoration: none; font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; }
    .hero {
      min-height: 100vh; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      padding: 100px 20px 80px;
    }
    .hero-date { font-size: 0.9rem; letter-spacing: 6px; text-transform: uppercase; color: #ff6a00; margin-bottom: 30px; }
    .hero-well {
      width: min(720px, 92vw); padding: 48px 36px 40px; border-radius: 50%;
      background: radial-gradient(ellipse at 50% 45%, rgba(10,10,20,0.97) 0%, rgba(10,10,20,0.92) 42%, rgba(10,10,20,0) 72%);
      display: flex; align-items: center; justify-content: center;
    }
    .hero-title {
      font-family: 'Syne', sans-serif; font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 800; line-height: 0.95; text-transform: uppercase;
      letter-spacing: -2px; margin: 0;
    }
    .hero-line { display: block; position: relative; }
    .hero-line-accent {
      background: linear-gradient(90deg, #ff6a00, #ff2d00, #ffcf4d, #ff6a00);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: #ff6a00;
    }
    .hero-char { display: inline-block; min-width: 0.55em; }
    .hero p { font-size: 1.1rem; color: #888; max-width: 500px; line-height: 1.7; margin: 24px 0 40px; }
    .btn-fill {
      padding: 16px 50px; background: linear-gradient(135deg, #ff6a00, #ff2d00);
      color: #fff; text-decoration: none; letter-spacing: 3px; text-transform: uppercase;
      font-size: 0.85rem; font-weight: 600;
    }
    .section { padding: 80px 60px 140px; }
    .section-title { font-family: 'Syne', sans-serif; font-size: 2rem; text-transform: uppercase; }
    .section-title span { color: #ff6a00; }
    .artist { padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.06); color: #ccc; }

    /* A — Accenno: un taglio sul bordo, solo all’attacco del Battito */
    .variant-a .hero-title { overflow: hidden; }
    .variant-a .slash {
      display: none; position: absolute; left: 8%; right: 8%; height: 3px; top: 42%;
      background: linear-gradient(90deg, #00e5ff, #ff2d6a); opacity: 0; pointer-events: none;
    }
    .variant-a.is-beat .slash { display: block; animation: slash 0.22s steps(2) 1; }
    @keyframes slash {
      0% { opacity: 0; transform: translate(-12px, -6px); }
      40% { opacity: 1; transform: translate(10px, 4px); }
      100% { opacity: 0; transform: translate(0, 0); }
    }

    /* B — Battito netto: due copie fantasma, solo durante il secondo di Battito */
    .variant-b .stage { position: relative; }
    .variant-b .ghost {
      position: absolute; inset: 0; pointer-events: none; opacity: 0;
      font-family: inherit; font-size: inherit; font-weight: inherit;
      line-height: inherit; letter-spacing: inherit; text-transform: inherit;
    }
    .variant-b.is-beat .ghost-cyan { opacity: 0.85; color: #00e5ff; transform: translate(-8px, 2px); mix-blend-mode: screen; }
    .variant-b.is-beat .ghost-pink { opacity: 0.85; color: #ff2d6a; transform: translate(8px, -2px); mix-blend-mode: screen; }

    /* C — Rumore continuo: il titolo vive in un campo glitch sempre acceso */
    .variant-c .glitch-field {
      position: relative; padding: 18px 22px;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px, rgba(0,229,255,0.06) 3px, rgba(255,45,106,0.05) 4px
      );
    }
    .variant-c .glitch-field::before,
    .variant-c .glitch-field::after {
      content: 'VISION\A FEST'; white-space: pre; position: absolute; left: 22px; top: 18px;
      font-family: 'Syne', sans-serif; font-size: clamp(3rem, 10vw, 6rem); font-weight: 800;
      line-height: 0.95; letter-spacing: -2px; pointer-events: none;
    }
    .variant-c .glitch-field::before { color: #00e5ff; transform: translate(-5px, 0); mix-blend-mode: screen; opacity: 0.45; }
    .variant-c .glitch-field::after { color: #ff2d6a; transform: translate(5px, 0); mix-blend-mode: screen; opacity: 0.45; }
    .variant-c.is-beat .glitch-field::before { opacity: 0.8; transform: translate(-10px, 2px); }
    .variant-c.is-beat .glitch-field::after { opacity: 0.8; transform: translate(10px, -2px); }

    #proto-state {
      position: fixed; top: 84px; left: 50%; transform: translateX(-50%); z-index: 20;
      font-size: 0.72rem; letter-spacing: 1px; text-transform: uppercase; color: #ffcf4d;
      background: rgba(0,0,0,0.7); padding: 6px 14px; border: 1px dashed #ff6a00; white-space: nowrap;
    }
    .proto-switcher {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 9999;
      display: flex; align-items: center; gap: 14px; padding: 10px 16px;
      background: #f4f0e6; color: #111; border-radius: 999px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.45); font-weight: 700; font-size: 0.85rem;
    }
    .proto-switcher button {
      width: 36px; height: 36px; border: 0; border-radius: 50%;
      background: #111; color: #f4f0e6; font-size: 1.1rem; cursor: pointer;
    }
    .proto-switcher strong { min-width: 240px; text-align: center; }
    @media (max-width: 768px) {
      nav { padding: 15px 20px; } nav ul { display: none; }
      .section { padding: 60px 20px 140px; }
      .proto-switcher strong { min-width: 150px; font-size: 0.75rem; }
      #proto-state { font-size: 0.62rem; max-width: 92vw; white-space: normal; text-align: center; }
    }
  </style>
</head>
<body>
  <canvas id="canvas-bg"></canvas>
  <nav>
    <div class="logo">Vision Fest</div>
    <ul><li><a href="#lineup">Lineup</a></li></ul>
  </nav>
  <div id="proto-state"></div>
  <div id="hero-host"></div>
  <section class="section" id="lineup">
    <div class="section-title">Line<span>up</span></div>
    <div class="artist">Aphex Twin — Venerdì 18</div>
    <div class="artist">Four Tet — Sabato 19</div>
  </section>
  <div class="proto-switcher" role="navigation" aria-label="Varianti prototipo">
    <button type="button" id="proto-prev" aria-label="Variante precedente">←</button>
    <strong id="proto-label"></strong>
    <button type="button" id="proto-next" aria-label="Variante successiva">→</button>
  </div>
  <script>
    const VARIANTS = { A: 'A (Accenno)', B: 'B (Battito netto)', C: 'C (Rumore continuo)' };
    const KEYS = Object.keys(VARIANTS);
    const CHARSET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const BEAT_MS = 1000;
    const PAUSE_MS = 6500;

    function titleLines() {
      return `<h1 class="hero-title" aria-label="Vision Fest">
        <span class="hero-line" data-text="VISION"></span>
        <span class="hero-line hero-line-accent" data-text="FEST"></span>
      </h1>`;
    }

    function markup(key) {
      const date = '<p class="hero-date">18-20 Luglio 2026 / Milano</p>';
      const copy = '<p>Dove la musica elettronica incontra la cultura digitale. Tre giorni di suono, luce e visione.</p>';
      const btn = '<a class="btn-fill" href="#lineup">Acquista Biglietti</a>';
      let inner = titleLines();
      if (key === 'A') inner = `<div class="stage">${titleLines()}<i class="slash" aria-hidden="true"></i></div>`;
      if (key === 'B') inner = `<div class="stage">
        <div class="ghost ghost-cyan" aria-hidden="true">VISION<br>FEST</div>
        <div class="ghost ghost-pink" aria-hidden="true">VISION<br>FEST</div>
        ${titleLines()}
      </div>`;
      if (key === 'C') inner = `<div class="glitch-field">${titleLines()}</div>`;
      return `<section class="hero variant-${key.toLowerCase()}" id="hero-root">
        ${date}<div class="hero-well">${inner}</div>${copy}${btn}
      </section>`;
    }

    function fillLetters() {
      document.querySelectorAll('.hero-line').forEach((line) => {
        const t = line.getAttribute('data-text');
        line.innerHTML = t.split('').map((ch) => `<span class="hero-char">${ch}</span>`).join('');
      });
    }

    function scrambleGuessable() {
      document.querySelectorAll('.hero-line').forEach((line) => {
        const t = line.getAttribute('data-text');
        const chars = line.querySelectorAll('.hero-char');
        const wrong = Math.min(1, t.length - 1);
        const idx = 1 + Math.floor(Math.random() * Math.max(1, t.length - 1));
        chars.forEach((el, i) => {
          el.textContent = (i === idx && i !== 0 && wrong)
            ? CHARSET[Math.floor(Math.random() * CHARSET.length)]
            : t[i];
        });
      });
    }

    function settle() {
      document.querySelectorAll('.hero-line').forEach((line) => {
        const t = line.getAttribute('data-text');
        line.querySelectorAll('.hero-char').forEach((el, i) => { el.textContent = t[i]; });
      });
    }

    let beatTimer = null;
    function startCycle() {
      clearTimeout(beatTimer);
      const root = document.getElementById('hero-root');
      if (!root) return;
      const beat = () => {
        if (!document.getElementById('hero-root')) return;
        const r = document.getElementById('hero-root').getBoundingClientRect();
        const onScreen = r.bottom > 80 && r.top < window.innerHeight - 40;
        if (onScreen) {
          root.classList.add('is-beat');
          scrambleGuessable();
          setTimeout(() => {
            root.classList.remove('is-beat');
            settle();
          }, BEAT_MS);
        }
        beatTimer = setTimeout(beat, BEAT_MS + PAUSE_MS);
      };
      beatTimer = setTimeout(beat, 400);
    }

    function currentKey() {
      const raw = new URLSearchParams(location.search).get('variant') || 'A';
      return VARIANTS[raw] ? raw : 'A';
    }

    function setVariant(key) {
      const next = VARIANTS[key] ? key : 'A';
      const url = new URL(location.href);
      url.searchParams.set('variant', next);
      history.replaceState({}, '', url);
      document.getElementById('hero-host').innerHTML = markup(next);
      fillLetters();
      document.body.dataset.variant = next;
      document.getElementById('proto-label').textContent = VARIANTS[next];
      const state = {
        A: 'Un taglio ciano/rosa solo all’attacco del Battito.',
        B: 'Due copie fantasma per tutto il secondo di Battito, poi via.',
        C: 'Campo glitch sempre acceso intorno al titolo; più forte nel Battito.'
      };
      document.getElementById('proto-state').textContent = 'Stato: ' + VARIANTS[next] + ' — ' + state[next];
      startCycle();
    }

    function step(dir) {
      const i = KEYS.indexOf(currentKey());
      setVariant(KEYS[(i + dir + KEYS.length) % KEYS.length]);
    }
    document.getElementById('proto-prev').onclick = () => step(-1);
    document.getElementById('proto-next').onclick = () => step(1);
    document.addEventListener('keydown', (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
      if (e.key === 'ArrowLeft') step(-1);
      if (e.key === 'ArrowRight') step(1);
    });
    setVariant(currentKey());

    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = innerWidth, height = canvas.height = innerHeight, time = 0;
    addEventListener('resize', () => { width = canvas.width = innerWidth; height = canvas.height = innerHeight; });
    const dots = [];
    for (let y = 0; y < 25; y++) for (let x = 0; x < 40; x++) {
      dots.push({ baseX: x * 20 - 400, baseY: y * 20 - 250 });
    }
    (function draw() {
      ctx.fillStyle = 'rgba(10,10,20,0.15)'; ctx.fillRect(0, 0, width, height);
      time += 0.02;
      dots.forEach((dot) => {
        const waveZ = Math.sin(time * 1.3 + dot.baseX * 0.02 + dot.baseY * 0.02) * 40;
        const rot = Math.sin(time * 0.3) * 0.5;
        const rx = dot.baseX * Math.cos(rot) - waveZ * Math.sin(rot);
        const rz = dot.baseX * Math.sin(rot) + waveZ * Math.cos(rot);
        const x = width / 2 + rx + Math.sin(time + dot.baseY * 0.03) * 30;
        const y = height / 2 + dot.baseY + Math.cos(time * 0.7 + dot.baseX * 0.03) * 25;
        const scale = 600 / (600 + rz);
        ctx.beginPath(); ctx.arc(x, y, 3 * scale, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,80,${scale * 20},${0.35 + scale * 0.4})`; ctx.fill();
      });
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
